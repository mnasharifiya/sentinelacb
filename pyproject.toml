[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelacb"
version = "1.0.0"
description = "Layered Cybersecurity Framework for Advanced Autonomous AI Control"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5,<3.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "structlog>=24.1",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pandas>=2.2"
]

[tool.setuptools.packages.find]
include = ["sentinelacb*"]
exclude = ["logs*", "configs*", "outputs*", "datasets*", "notebooks*", "evaluation*", "experiments*", "tests*", "scripts*", "docs*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]